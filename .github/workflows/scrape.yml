name: Daily Municipal Solicitor Scraper

on:
  schedule:
    - cron: '0 11 * * *' # Daily at 6:00 AM CST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber playwright
          playwright install chromium

      - name: Run Multi-Engine Scraper
        run: python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily multi-scenario solicitor refresh" && git push)
